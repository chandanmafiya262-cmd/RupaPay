<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>RupaPay Admin</title><style>body{font-family:system-ui;background:#0b1020;color:#fff;padding:18px;max-width:700px;margin:auto}.card{background:#151d31;border:1px solid #26314a;border-radius:18px;padding:18px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:10px;margin:5px 0}input{width:100%;box-sizing:border-box;background:#0f172a;color:#fff;border:1px solid #26314a}button{border:0;background:#39d98a;font-weight:700}</style></head><body><h1>RupaPay Admin</h1><div class="card"><b>Prototype admin panel</b><p>This is only a UI prototype. It is not secure and must not control real money.</p><input id="pin" type="password" placeholder="Demo PIN"><button onclick="openPanel()">Open</button></div><div id="p" style="display:none"><div class="card"><h2>Task management</h2><input placeholder="Task title"><input placeholder="Reward"><button onclick="alert('Backend required to save tasks.')">Add task</button></div><div class="card"><h2>Reports</h2><p>Users, tasks and withdrawals will be connected after a secure backend is added.</p></div></div><script>function openPanel(){if(pin.value==="2626")p.style.display="block";else alert("Wrong demo PIN")}</script></body></html>
